[package]
name = "wispx"
version = "2.0.1"
edition = "2024"
rust-version = "1.92"
description = "Hold Ctrl+Win to dictate with ChatGPT"
build = "build.rs"

[[bin]]
name = "WispX"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
cpal = "0.16"
httpdate = "1"
opus-rs = "=0.1.41"
# Slint already uses fontique; enable its supported fontconfig runtime loader.
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18", "unstable-winit-030"] }
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip", "json"] }
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
hound = "3.5"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
  "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Registry",
  "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_System_Variant",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility", "Win32_UI_Controls",
  "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_HiDpi",
  "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm",
  "Win32_Media_Audio", "Win32_Storage_FileSystem"
] }

# Desktop integration for Linux. Versions match those Slint's winit backend already
# pulls in, so X11, Wayland, D-Bus and clipboard code is shared rather than duplicated.
[target.'cfg(target_os = "linux")'.dependencies]
ab_glyph = "0.2"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
async-io = "2"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts", "remote_desktop", "screencast"] }
futures-lite = "2"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
wl-clipboard-rs = "0.9"
x11rb = { version = "0.13", features = ["randr", "resource_manager", "shape", "xfixes", "xinput", "xtest"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[build-dependencies]
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }
slint-build = "=1.18.1"
embed-resource = "3"

[profile.release]
lto = "thin"
strip = "debuginfo"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
