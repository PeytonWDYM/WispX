[package]
name = "wispx"
version = "2.0.0"
edition = "2024"
rust-version = "1.89"
description = "Hold-to-dictate for Linux and Windows, transcribed locally by whisper.cpp or by ChatGPT"
repository = "https://github.com/PeytonWDYM/WispX"
publish = false

# Deliberately one direct dependency. HTTP and speech recognition, and on Linux
# audio capture, clipboard and notifications, are delegated to native tools run
# as subprocesses; see "What WispX runs" in the README for the full list.
[dependencies]
serde_json = { version = "1", default-features = false, features = ["std"] }

# The desktop interface is a second program, so the command line and the daemon
# load no Qt and keep working even if Qt breaks. Without this feature only
# `wispx` is built, which needs no native libraries at all.
[features]
default = ["gui"]
gui = []

[[bin]]
name = "wispx"
path = "src/main.rs"

[[bin]]
name = "wispx-gui"
path = "src/bin/wispx-gui.rs"
required-features = ["gui"]

[[test]]
name = "gui_nested"
path = "tests/gui_nested.rs"
required-features = ["gui"]

[profile.release]
lto = true
codegen-units = 1
strip = true
