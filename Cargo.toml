[package]
name = "wispx"
version = "1.1.1"
edition = "2024"
rust-version = "1.92"
description = "Hold Ctrl+Win to dictate with ChatGPT"
build = "build.rs"

[[bin]]
name = "WispX"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
cpal = "0.16"
httpdate = "1"
opus-rs = "=0.1.41"
# Slint already uses fontique; enable its supported fontconfig runtime loader.
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18", "unstable-winit-030"] }
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip", "json"] }
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
hound = "3.5"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
  "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Registry",
  "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_Ole",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility", "Win32_UI_Controls",
  "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_HiDpi",
  "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm",
  "Win32_Media_Audio", "Win32_Storage_FileSystem"
] }

[build-dependencies]
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }
slint-build = "=1.18.1"
embed-resource = "3"

[profile.release]
lto = "thin"
strip = "debuginfo"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
