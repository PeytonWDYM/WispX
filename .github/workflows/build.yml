name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One runner builds everything, so a new push to a PR cancels that PR's stale run.
# Pushes to main and release tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Builds on the Tailscale self-hosted Linux runner. Fork PRs stay on a
    # GitHub-hosted runner so outside code never executes on our machine.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4

      # checkout wipes ignored files, so the toolchains and build cache live outside the
      # workspace and survive between runs on the self-hosted runner.
      - name: Verify core and cross-build Windows
        shell: bash
        run: |
          export WISPX_TOOLS_DIR="$HOME/.cache/wispx/tools"
          export CARGO_TARGET_DIR="$HOME/.cache/wispx/target"
          bash scripts/ci-linux.sh
          mkdir -p dist
          cp "$CARGO_TARGET_DIR/x86_64-pc-windows-gnu/release/WispX.exe" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: WispX
          path: dist/WispX.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WispX

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" WispX.exe \
            --repo "$GITHUB_REPOSITORY" --title "WispX $GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" WispX.exe --repo "$GITHUB_REPOSITORY" --clobber
