name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Builds on the Tailscale self-hosted Linux runner. Fork PRs stay on a
    # GitHub-hosted runner so outside code never executes on our machine.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # WPF targets Windows; EnableWindowsTargeting lets Linux compile the win-x64 exe.
      - name: Publish
        run: dotnet publish src -c Release -p:EnableWindowsTargeting=true

      - uses: actions/upload-artifact@v4
        with:
          name: WispX
          path: src/bin/Release/net9.0-windows/win-x64/publish/WispX.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WispX

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" WispX.exe \
            --repo "$GITHUB_REPOSITORY" --title "WispX $GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" WispX.exe --repo "$GITHUB_REPOSITORY" --clobber
