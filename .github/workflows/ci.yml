name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      # Tests talk to a private dbus-daemon of their own. Everything else they
      # run is a script standing in for the real tool, so neither a microphone,
      # a display, a network nor an account is involved.
      - name: Install dbus-daemon
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: cargo build --locked --release
